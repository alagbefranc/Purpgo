# API (compose service "backend"). NOT DEPLOYED. See DEPLOY-PLAN.md.
# Public hostname (new): api.purpgo.com
# Also reachable inside the org at purpgo-api.internal:8080
app = "purpgo-api"
primary_region = "yyz"

[build]
  dockerfile = "deploy/docker/backend.Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "40s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
