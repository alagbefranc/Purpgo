# API (compose service "backend"). See DEPLOY-PLAN.md.
# Public hostname (new): api.purpgo.com
# Also reachable inside the org at purpgo-api.internal:8080
app = "purpgo-api"
primary_region = "yyz"

[build]
  dockerfile = "../../deploy/docker/backend.Dockerfile"

[env]
  API_HOST = ":8080"
  GIN_MODE = "release"
  AWS_CONFIG_ENABLED = "false"
  GEODB_PATH = "/app/data/GeoLite2-City.mmdb"
  ENCRYPTED_KEYS_PROVIDER = "postgres"
  CAPTCHA_PROVIDER = "none"
  INBOX_TAGGING_ENABLED = "false"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "40s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
