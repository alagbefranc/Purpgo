# Event consumer. No public address.
# Reachable only on the Fly private network if something dials it; it dials out.
app = "purpgo-consumer"
primary_region = "yyz"

[build]
  dockerfile = "../../deploy/docker/consumer.Dockerfile"

[env]
  AWS_CONFIG_ENABLED = "false"
  GEODB_PATH = "/app/data/GeoLite2-City.mmdb"
  ENCRYPTED_KEYS_PROVIDER = "postgres"
  INBOX_TAGGING_ENABLED = "false"
  CAPTCHA_PROVIDER = "none"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
