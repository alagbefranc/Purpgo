# Public forms. NOT DEPLOYED. See DEPLOY-PLAN.md.
# Public hostname (new): forms.purpgo.com
# Optional for v1. Ships stopped until the first request.
# Comfortable tier: min_machines_running = 1 and auto_stop_machines = "off".
app = "purpgo-forms"
primary_region = "yyz"

[build]
  dockerfile = "deploy/docker/forms.Dockerfile"

[http_service]
  internal_port = 8090
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
