# Open/click tracking (compose service "tracking"). NOT DEPLOYED.
# Public hostname (new): links.purpgo.com
# Upstream prefers a separate registered domain. This subdomain is the v1
# compromise and will trip the tracking_domain_shares_brand health check.
app = "purpgo-links"
primary_region = "yyz"

[build]
  dockerfile = "tracking/Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
