# WebSocket fanout. NOT DEPLOYED. See DEPLOY-PLAN.md.
# Public hostname (new): rt.purpgo.com
app = "purpgo-rt"
primary_region = "yyz"

[build]
  dockerfile = "deploy/docker/realtime.Dockerfile"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
