# Redis 7. NOT DEPLOYED. No public address.
# Private: purpgo-redis.internal:6379
app = "purpgo-redis"
primary_region = "yyz"

[build]
  dockerfile = "deploy/fly/redis.Dockerfile"

[mounts]
  source = "redis_data"
  destination = "/data"

[[checks]]
  grace_period = "10s"
  interval = "15s"
  method = "tcp"
  port = 6379
  timeout = "2s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
