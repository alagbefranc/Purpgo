# Dashboard. NOT DEPLOYED. See DEPLOY-PLAN.md.
# Public hostname (new): app.purpgo.com
app = "purpgo-web"
primary_region = "yyz"

[build]
  dockerfile = "web/Dockerfile"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
